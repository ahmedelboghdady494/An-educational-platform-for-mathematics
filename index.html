<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>An Educational Platform for Mathematics | Grade 9 Advanced</title>
<style>
:root{--bg:#eef9fc;--card:#fff;--ink:#12384a;--muted:#64808d;--line:#cfe4ea;--blue:#2f9db3;--blue2:#177a98;--soft:#e1f5f8;--green:#37a878;--shadow:0 10px 30px rgba(36,93,112,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eaf8fc,#f8fcfd);color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:70px;position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{display:flex;gap:11px;align-items:center;cursor:pointer}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#bcecf4,#8ed2e2);display:grid;place-items:center;font-size:22px}.brand b{display:block;font-size:16px}.brand small{display:block;color:var(--muted);margin-top:2px}.top-actions{display:flex;gap:9px;align-items:center}.profile-btn,.top-btn{border:1px solid var(--line);background:#f8fdff;color:var(--ink);border-radius:13px;min-height:42px;padding:7px 11px}.profile-btn{display:flex;align-items:center;gap:8px}.mini-avatar{width:31px;height:31px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:20px}
.wrap{max-width:1280px;margin:auto;padding:25px 22px 60px}.page-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin:4px 0 20px}.page-head h1,.page-head h2{margin:0 0 5px}.page-head p{margin:0;color:var(--muted)}.back{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:11px}.primary{border:0;background:linear-gradient(135deg,#39abc1,#257f9c);color:#fff;border-radius:12px;padding:12px 17px;font-weight:800}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 17px;font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill,.tag{display:inline-block;padding:6px 10px;border-radius:30px;background:var(--soft);color:var(--blue2);font-size:11px;font-weight:800}
.term-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.term-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:23px;box-shadow:var(--shadow);min-height:210px}.term-card.active{background:linear-gradient(145deg,#fff,#ecfafc);border-color:#8ccbd8}.term-card.disabled{opacity:.65}.term-number{font-size:39px;font-weight:900;color:#acdbe5}.term-card h3{margin:8px 0}.term-card p{color:var(--muted);line-height:1.6;font-size:13px}
.section-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.section-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);text-align:left}.section-card .ic{font-size:28px}.section-card h3{font-size:15px;margin:10px 0 5px}.section-card p{font-size:12px;color:var(--muted);line-height:1.5}
.unit-grid,.quiz-grid,.challenge-grid,.achievement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.unit,.quiz-card,.challenge-card,.achievement,.lesson-box,.question,.result,.profile-box,.world{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.unit{overflow:hidden}.unit-head{padding:18px;display:flex;gap:12px;align-items:center}.unit-icon{width:50px;height:50px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:24px}.unit-head h3{margin:0}.unit-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.unit-toggle{margin-left:auto;border:1px solid var(--line);background:#f7fcfd;border-radius:10px;padding:8px 11px}.lessons{border-top:1px solid var(--line);padding:10px 13px 14px;display:grid;gap:7px}.lesson{border:1px solid #dcecef;background:#f9fdfe;border-radius:11px;padding:12px;text-align:left;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}.lesson:hover{background:#eaf8fb;border-color:#a9d6df}
.lesson-box,.question,.result,.profile-box,.world{padding:23px}.file-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}.file-card{border:1px solid var(--line);background:#f8fdfe;border-radius:15px;padding:18px}.file-card h3{font-size:16px}.file-card p{font-size:12px;color:var(--muted);line-height:1.5;min-height:45px}.file-card button{width:100%}.quiz-card,.challenge-card,.achievement{padding:19px}.quiz-card h3,.challenge-card h3,.achievement h3{margin:8px 0}.quiz-card p,.challenge-card p,.achievement p{color:var(--muted);font-size:12px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.stat small{color:var(--muted)}.stat b{display:block;font-size:27px;margin-top:6px}.qtext{font-size:19px;line-height:1.65;margin-top:10px}.qtext img,.resource img{max-width:min(100%,430px);height:auto;vertical-align:middle;background:#fff}.answers{display:grid;gap:9px;margin-top:18px}.answer{width:100%;text-align:left;border:1px solid var(--line);background:#f8fdfe;color:var(--ink);border-radius:12px;padding:13px}.answer.selected{border-color:#43a6ba;background:#e5f7fa}.answer.correct{border-color:#55b78b;background:#eaf9f1}.answer.wrong{border-color:#d98787;background:#fff1f1}.quiz-bar{height:8px;border-radius:9px;background:#e5eff2;overflow:hidden;margin:14px 0}.quiz-fill{height:100%;background:linear-gradient(90deg,#49b8c7,#318aa5)}.quiz-controls{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.review{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}.progress-list{display:grid;gap:11px}.progress-row{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.progress-row>div:first-child{display:flex;justify-content:space-between}.bar{height:8px;background:#e7f0f3;border-radius:9px;margin-top:10px;overflow:hidden}.fill{height:100%;background:#43ae86}
.profile-layout{display:grid;grid-template-columns:200px 1fr;gap:20px}.profile-preview{text-align:center;background:#effafd;border:1px solid var(--line);border-radius:20px;padding:20px}.big-avatar{width:105px;height:105px;border-radius:50%;background:#e4f7fa;border:1px solid #c5e5eb;display:grid;place-items:center;font-size:58px;margin:0 auto 12px}.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.avatar-option{border:2px solid transparent;background:#f5fbfd;border-radius:14px;padding:8px;font-size:28px}.avatar-option.selected{border-color:#43a7ba;background:#e2f7fa}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #bdd8e0;background:#fff;border-radius:11px;padding:12px;color:var(--ink);outline:none}
.world{background:linear-gradient(135deg,#f8feff,#eefaf6)}.world-stage{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:17px}.world-item{background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center;padding:18px;min-height:135px}.world-item.locked{opacity:.4}.world-item b{display:block;margin-top:8px}.xpbar{height:11px;background:#dfeef1;border-radius:20px;overflow:hidden}.xpbar div{height:100%;background:linear-gradient(90deg,#5bc49a,#39a7bd)}
.resource{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.resource-q{padding:16px 0;border-bottom:1px solid #e3eef1;line-height:1.7}.resource-q:last-child{border-bottom:0}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e2f7fb,#f8fcfd)}.auth-card{width:min(900px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 20px 60px rgba(29,83,100,.13)}.auth-card h1{margin:0 0 7px}.muted{color:var(--muted);line-height:1.6}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:20px}.auth-grid .full{grid-column:1/-1}.auth-actions{display:flex;justify-content:flex-end;margin-top:20px}.toast{position:fixed;right:18px;bottom:18px;background:#173f4e;color:#fff;padding:12px 15px;border-radius:11px;opacity:0;transform:translateY(12px);transition:.2s;z-index:100}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:950px){.section-grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.world-stage{grid-template-columns:repeat(3,1fr)}.profile-layout{grid-template-columns:1fr}.unit-grid,.quiz-grid,.challenge-grid,.achievement-grid{grid-template-columns:1fr}}
@media(max-width:650px){.top{padding:0 10px}.brand small{display:none}.brand b{font-size:13px}.profile-btn span:last-child{display:none}.wrap{padding:15px 11px 40px}.term-grid,.file-grid{grid-template-columns:1fr}.section-grid{grid-template-columns:1fr 1fr}.fields,.auth-grid{grid-template-columns:1fr}.field.full,.auth-grid .full{grid-column:auto}.world-stage{grid-template-columns:1fr 1fr}.page-head{flex-direction:column}.avatar-grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script src="worksheet_data.js"></script>
<script>
const AVATARS=['👦🏻','👦🏽','👦🏾','🧑🏻','🧑🏽','👧🏻','👧🏽','👧🏾','🧑🏻‍🎓','🧑🏽‍🎓'];
const MODULES={
'Unit 2':{icon:'📐',title:'Equations in One Variable',lessons:['2-1','2-2','2-3','2-4','2-5','2-6']},
'Unit 3':{icon:'📈',title:'Linear Relationships',lessons:['3-6']},
'Unit 4':{icon:'📊',title:'Linear Functions',lessons:['4-1','4-2','4-3','4-4','4-5','4-6','4-7']},
'Unit 5':{icon:'🧮',title:'Systems of Linear Equations',lessons:['5-1','5-2','5-6']}
};
let page='home',history=[],selectedLesson=null,selectedUnit=null,quizState=null,challengeState=null,setupAvatar=AVATARS[0];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function prof(){try{return JSON.parse(localStorage.getItem('aa_profile')||'{}')}catch(e){return{}}}
function setProf(p){localStorage.setItem('aa_profile',JSON.stringify(p))}
function xp(){return Number(localStorage.getItem('aa_xp')||0)}
function addXP(n){localStorage.setItem('aa_xp',String(xp()+n))}
function results(){try{return JSON.parse(localStorage.getItem('aa_results')||'[]')}catch(e){return[]}}
function saveResult(r){let a=results().filter(x=>!(x.type===r.type&&x.lesson===r.lesson&&x.id===r.id));a.unshift(r);localStorage.setItem('aa_results',JSON.stringify(a.slice(0,500)))}
function getLesson(id){return (window.WORKSHEET_DATA||[]).find(x=>x.id===id)}
function clean(h){return (h||'').replace(/^<p[^>]*>/,'').replace(/<\/p>$/,'')}
function shell(){const p=prof();const av=p.avatar||AVATARS[0];return `<header class="top"><div class="brand" onclick="go('home')"><div class="logo">∑</div><div><b>An Educational Platform for Mathematics</b><small>Grade 9 Advanced · UAE Curriculum</small></div></div><div class="top-actions"><button class="top-btn" onclick="go('achievements')">🏆</button><button class="profile-btn" onclick="go('profile')"><span class="mini-avatar">${av}</span><span>${esc(p.fullName||'Student')}</span>⌄</button></div></header><main class="wrap" id="main"></main>`}
function go(p,extra){if(p!==page)history.push(page);page=p;if(extra){selectedUnit=extra.unit||selectedUnit;selectedLesson=extra.lesson||selectedLesson}render()}
function back(){const p=history.pop();if(p){page=p;render()}else{page='home';render()}}
function render(){if(!prof().fullName)return showAuth();document.getElementById('app').innerHTML=shell();({home:home,terms:terms,lessons:lessons,lesson:lesson,quizzes:quizzes,challenges:challenges,progress:progress,worksheets:worksheets,mathworld:mathworld,achievements:achievements,profile:profilePage,quiz:quizPage,challenge:challengePage,resource:resourcePage}[page]||home)()}
function home(){document.getElementById('main').innerHTML=`<div class="page-head"><div><h1>Choose Your Term</h1><p>Term 1 is active. Terms 2 and 3 are prepared as separate spaces.</p></div></div><div class="term-grid"><div class="term-card active"><div class="term-number">01</div><h3>Term 1</h3><p>Lessons, quizzes, challenges, progress and worksheets.</p><button class="primary" onclick="go('terms')">Open Term 1 →</button></div><div class="term-card disabled"><div class="term-number">02</div><h3>Term 2 🔒</h3><p>Coming Soon.</p><button class="secondary" disabled>Coming Soon</button></div><div class="term-card disabled"><div class="term-number">03</div><h3>Term 3 🔒</h3><p>Coming Soon.</p><button class="secondary" disabled>Coming Soon</button></div></div>`}
function terms(){document.getElementById('main').innerHTML=`<div class="page-head"><div><h1>Term 1</h1><p>Everything for Term 1 is inside these sections.</p></div><button class="back" onclick="back()">← Back</button></div><div class="section-grid"><button class="section-card" onclick="go('lessons')"><div class="ic">📚</div><h3>Lessons</h3><p>Unit → lesson → resources.</p></button><button class="section-card" onclick="go('quizzes')"><div class="ic">📝</div><h3>Quizzes</h3><p>10 sets × 10 source questions.</p></button><button class="section-card" onclick="go('challenges')"><div class="ic">🧠</div><h3>Challenges</h3><p>30 challenge slots per lesson.</p></button><button class="section-card" onclick="go('progress')"><div class="ic">📊</div><h3>Progress</h3><p>Results by quiz/challenge.</p></button><button class="section-card" onclick="go('worksheets')"><div class="ic">📄</div><h3>Worksheets</h3><p>20 questions from your Word file.</p></button></div><div class="world" style="margin-top:18px"><h2>🌟 Math World</h2><p class="muted">Your world grows from real activity.</p><button class="secondary" style="margin-top:10px" onclick="go('mathworld')">Open Math World</button></div>`}
function lessons(){let h=`<div class="page-head"><div><h1>Lessons</h1><p>Units are collapsed. Open a unit to reveal its lessons.</p></div><button class="back" onclick="go('terms')">← Term 1</button></div><div class="unit-grid">`;for(const [u,m] of Object.entries(MODULES)){h+=`<section class="unit"><div class="unit-head"><div class="unit-icon">${m.icon}</div><div><h3>${u} · ${m.title}</h3><p>${m.lessons.length} lessons</p></div><button class="unit-toggle" onclick="toggleUnit('${u}')">Open</button></div><div class="lessons hidden" id="unit_${u.replace(/\s/g,'_')}">${m.lessons.map(id=>{const l=getLesson(id);return `<button class="lesson" onclick="openLesson('${u}','${id}')"><span><b>${id}</b> · ${esc(l?.title||'Lesson')}</span><span>→</span></button>`}).join('')}</div></section>`}h+='</div>';document.getElementById('main').innerHTML=h}
function toggleUnit(u){const e=document.getElementById('unit_'+u.replace(/\s/g,'_'));if(e)e.classList.toggle('hidden')}
function openLesson(u,id){selectedUnit=u;selectedLesson=id;localStorage.setItem('aa_lessons_opened',String(Number(localStorage.getItem('aa_lessons_opened')||0)+1));go('lesson')}
function lesson(){const l=getLesson(selectedLesson);if(!l)return go('lessons');document.getElementById('main').innerHTML=`<div class="page-head"><div><button class="back" onclick="go('lessons')">← Lessons</button><h1 style="margin-top:13px">${l.id}</h1><p>${esc(l.title)}</p></div></div><div class="lesson-box"><span class="tag">Term 1 · ${esc(selectedUnit)}</span><h2 style="margin:10px 0">Lesson resources</h2><p class="muted">Practice, solutions and explanation are kept separate.</p><div class="file-grid"><div class="file-card"><div style="font-size:30px">📝</div><h3>Practice / Unsolved</h3><p>20 source questions without solutions.</p><button class="primary" onclick="openResource('${l.id}','practice')">Open Practice</button></div><div class="file-card"><div style="font-size:30px">✅</div><h3>Solutions / Solved</h3><p>Answer key and solution notes.</p><button class="primary" onclick="openResource('${l.id}','solutions')">Open Solutions</button></div><div class="file-card"><div style="font-size:30px">💡</div><h3>Explanation / Summary</h3><p>Source-based explanation and answer notes.</p><button class="primary" onclick="openResource('${l.id}','explanation')">Open Explanation</button></div></div><div class="actions"><button class="primary" onclick="showQuizSets('${l.id}')">📝 Quizzes</button><button class="secondary" onclick="showChallenges('${l.id}')">🧠 Challenges</button><button class="secondary" onclick="openWorksheet('${l.id}')">📄 Worksheet</button></div></div>`}
async function openResource(id,type){const file=`files/${id}-${type}.pdf`;try{const r=await fetch(file,{method:'HEAD',cache:'no-store'});if(r.ok){window.open(file,'_blank','noopener');return}}catch(e){}selectedLesson=id;localStorage.setItem('resourceType',type);go('resource')}
function resourcePage(){const l=getLesson(selectedLesson),type=localStorage.getItem('resourceType')||'practice';if(!l)return go('lessons');let body='';if(type==='practice'){body=l.questions.map((q,i)=>`<div class="resource-q"><b>Question ${i+1}</b><div class="qtext">${clean(q.html)}</div>${q.options?.length?`<div class="answers">${q.options.map(o=>`<div class="answer">${clean(o)}</div>`).join('')}</div>`:'<div style="height:70px;border-bottom:1px dashed #bdd7df"></div>'}</div>`).join('')}else if(type==='solutions'){body=l.questions.map((q,i)=>`<div class="resource-q"><b>Question ${i+1}</b><div class="qtext">${clean(q.html)}</div><div class="answer correct" style="margin-top:10px"><b>Answer / Solution:</b><br>${q.options?.length?clean(q.options[Number(q.correctIndex)]||''):clean(q.answerKey||q.answer||'See explanation')}</div></div>`).join('')}else{body=`<div><span class="tag">Source-based explanation</span><h2>${esc(l.title)}</h2><p class="muted">This explanation is built from the uploaded Term 1 worksheet and its answer key. It is kept separate from the unsolved practice.</p>${l.questions.slice(8).map((q,i)=>`<div class="resource-q"><b>Concept ${i+9}</b><div style="margin-top:6px">${clean(q.html)}</div><div class="muted" style="margin-top:6px">${clean(q.answerKey||q.answer||'')}</div></div>`).join('')}</div>`}document.getElementById('main').innerHTML=`<div class="page-head"><div><button class="back" onclick="go('lesson')">← Lesson</button><h1 style="margin-top:13px">${idTitle(selectedLesson)} · ${type}</h1></div></div><div class="resource">${body}</div>`}
function idTitle(id){const l=getLesson(id);return esc(l?.title||'Lesson')}
function quizzes(){let h=`<div class="page-head"><div><h1>Quizzes</h1><p>Each lesson has 10 sets. Every set contains 10 questions from the uploaded source.</p></div><button class="back" onclick="go('terms')">← Term 1</button></div><div class="unit-grid">`;for(const [u,m] of Object.entries(MODULES)){h+=`<section class="unit"><div class="unit-head"><div class="unit-icon">📝</div><div><h3>${u} · ${m.title}</h3><p>${m.lessons.length} lessons</p></div></div><div class="lessons">${m.lessons.map(id=>`<button class="lesson" onclick="showQuizSets('${id}')"><span><b>${id}</b> · ${esc(getLesson(id)?.title||'')}</span><span>→</span></button>`).join('')}</div></section>`}h+='</div>';document.getElementById('main').innerHTML=h}
function showQuizSets(id){selectedLesson=id;const l=getLesson(id);document.getElementById('main').innerHTML=`<div class="page-head"><div><button class="back" onclick="go('quizzes')">← Quizzes</button><h1 style="margin-top:13px">${id} · Quiz Sets</h1><p>${esc(l.title)}</p></div></div><div class="quiz-grid">${Array.from({length:10},(_,i)=>{const r=results().find(x=>x.type==='quiz'&&x.lesson===id&&x.id===i+1);return `<div class="quiz-card"><span class="tag">Set ${i+1}</span><h3>10 Questions</h3><p>${r?'Last score: '+r.percent+'%':'Not attempted yet.'}</p><button class="primary" onclick="startQuiz('${id}',${i+1})">${r?'Retake':'Start Quiz'}</button></div>`}).join('')}</div>`}
function makeQuiz(id,set){const l=getLesson(id);let q=l.questions||[];let start=(set-1)*2%q.length;let chosen=[];for(let i=0;i<10;i++)chosen.push(q[(start+i*2)%q.length]);chosen=chosen.map(x=>JSON.parse(JSON.stringify(x)));let seed=Date.now()%2147483647;for(let i=chosen.length-1;i>0;i--){seed=(seed*48271)%2147483647;let j=seed%(i+1);[chosen[i],chosen[j]]=[chosen[j],chosen[i]]}return chosen}
function startQuiz(id,set){selectedLesson=id;quizState={id,set,qs:makeQuiz(id,set),i:0,answers:[]};go('quiz')}
function quizPage(){const q=quizState;if(!q)return go('quizzes');const x=q.qs[q.i];const pct=Math.round(q.i/q.qs.length*100);document.getElementById('main').innerHTML=`<div class="page-head"><div><button class="back" onclick="go('quizzes')">← Exit</button><h1 style="margin-top:13px">${q.id} · Quiz ${q.set}</h1><p>Question ${q.i+1} of 10</p></div></div><div class="quiz-bar"><div class="quiz-fill" style="width:${pct}%"></div></div><div class="question"><span class="tag">SOURCE QUESTION</span><div class="qtext">${clean(x.html)}</div>${x.options?.length?`<div class="answers">${x.options.map((o,i)=>`<button class="answer ${q.answers[q.i]===i?'selected':''}" onclick="quizPick(${i})">${clean(o)}</button>`).join('')}</div>`:`<textarea id="written" style="width:100%;min-height:140px;margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="Write your answer..."></textarea>`}<div class="quiz-controls"><button class="secondary" onclick="go('quizzes')">Exit</button><button class="primary" onclick="quizNext()">${q.i===9?'Finish Quiz':'Next →'}</button></div></div>`}
function quizPick(i){quizState.answers[quizState.i]=i;quizPage()}
function norm(s){return String(s||'').toLowerCase().replace(/<[^>]*>/g,' ').replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').trim()}
function writtenCorrect(q,a){const k=norm(q.answerKey||q.answer),g=norm(a);if(!k||!g)return false;const w=k.split(/\s+/).filter(x=>x.length>2).slice(0,8);return w.length>0&&w.filter(x=>g.includes(x)).length>=Math.max(1,Math.ceil(w.length*.45))}
function quizNext(){const q=quizState,x=q.qs[q.i];if(x.options?.length){if(q.answers[q.i]===undefined){toast('Choose an answer first.');return}}else{const a=document.getElementById('written')?.value.trim();if(!a){toast('Write an answer first.');return}q.answers[q.i]=a}if(q.i<9){q.i++;quizPage()}else finishQuiz()}
function finishQuiz(){const q=quizState;let correct=0;q.qs.forEach((x,i)=>{if(x.options?.length){if(q.answers[i]===Number(x.correctIndex))correct++}else if(writtenCorrect(x,q.answers[i]))correct++});const percent=Math.round(correct/10*100);saveResult({type:'quiz',lesson:q.id,id:q.set,percent,correct,total:10,date:new Date().toLocaleString(),answers:q.answers});addXP(correct*4);document.getElementById('main').innerHTML=`<div class="result" style="text-align:center"><div style="font-size:60px">${percent>=80?'🏆':percent>=50?'⭐':'💪'}</div><h1>Quiz Complete</h1><div style="font-size:42px;font-weight:900;margin:14px">${percent}%</div><p>Correct: ${correct} · Wrong: ${10-correct}</p><div class="actions" style="justify-content:center"><button class="primary" onclick="reviewQuiz()">🔎 Review Answers</button><button class="secondary" onclick="showQuizSets('${q.id}')">All Sets</button><button class="secondary" onclick="go('progress')">Progress</button></div></div>`}
function reviewQuiz(){const q=quizState;document.getElementById('main').innerHTML=`<div class="page-head"><div><button class="back" onclick="go('quizzes')">← Quizzes</button><h1>Review · ${q.id} · Set ${q.set}</h1></div></div>${q.qs.map((x,i)=>{const ua=q.answers[i];const ok=x.options?.length?ua===Number(x.correctIndex):writtenCorrect(x,ua);return `<div class="question" style="margin-bottom:13px;border-left:6px solid ${ok?'#43ae86':'#d96f76'}"><b>Question ${i+1}</b><div class="qtext">${clean(x.html)}</div><div class="answer ${ok?'correct':'wrong'}" style="margin-top:10px"><b>${ok?'✅ Correct':'❌ Incorrect'}</b><br>Your answer: ${x.options?.length?clean(x.options[ua]||'No answer'):esc(ua||'No answer')}<br>Correct answer: ${x.options?.length?clean(x.options[Number(x.correctIndex)]||''):clean(x.answerKey||x.answer||'See solutions')}</div></div>`}).join('')}`}
function challenges(){let h=`<div class="page-head"><div><h1>Challenges</h1><p>30 higher-thinking practice slots per lesson, based on the source material.</p></div><button class="back" onclick="go('terms')">← Term 1</button></div><div class="unit-grid">`;for(const [u,m] of Object.entries(MODULES)){h+=`<section class="unit"><div class="unit-head"><div class="unit-icon">🧠</div><div><h3>${u}</h3><p>${m.lessons.length} lessons</p></div></div><div class="lessons">${m.lessons.map(id=>`<button class="lesson" onclick="showChallenges('${id}')"><span><b>${id}</b> · ${esc(getLesson(id)?.title||'')}</span><span>→</span></button>`).join('')}</div></section>`}h+='</div>';document.getElementById('main').innerHTML=h}
function showChallenges(id){selectedLesson=id;const l=getLesson(id);document.getElementById('main').innerHTML=`<div class="page-head"><div><button class="back" onclick="go('challenges')">← Challenges</button><h1 style="margin-top:13px">${id} · Challenges</h1><p>${esc(l.title)} · 30 slots</p></div></div><div class="challenge-grid">${Array.from({length:30},(_,i)=>`<div class="challenge-card"><span class="tag">Challenge ${i+1}</span><h3>Higher Thinking</h3><p>Use the source question to solve, explain or justify your reasoning.</p><button class="primary" onclick="startChallenge('${id}',${i+1})">Start Challenge</button></div>`).join('')}</div>`}
function startChallenge(id,n){const l=getLesson(id);let qs=l.questions.slice(8);challengeState={id,n,qs,index:(n-1)%qs.length};go('challenge')}
function challengePage(){const c=challengeState,x=c.qs[c.index];document.getElementById('main').innerHTML=`<div class="page-head"><div><button class="back" onclick="go('challenges')">← Challenges</button><h1 style="margin-top:13px">${c.id} · Challenge ${c.n}</h1><p>Explain your reasoning, not just the final answer.</p></div></div><div class="question"><span class="tag">THINK + JUSTIFY</span><div class="qtext">${clean(x.html)}</div>${x.options?.length?`<div class="answers">${x.options.map((o,i)=>`<button class="answer" onclick="finishChallenge(${i===Number(x.correctIndex)})">${clean(o)}</button>`).join('')}</div>`:`<textarea id="challengeText" style="width:100%;min-height:160px;margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="Show your reasoning..."></textarea><div class="actions"><button class="primary" onclick="finishWrittenChallenge()">Check Answer</button></div>`}</div>`}
function finishChallenge(ok){saveResult({type:'challenge',lesson:challengeState.id,id:challengeState.n,percent:ok?100:0,correct:ok?1:0,total:1,date:new Date().toLocaleString()});addXP(ok?8:2);toast(ok?'Challenge completed!':'Recorded. Review the lesson solution.');go('challenges')}
function finishWrittenChallenge(){const c=challengeState,x=c.qs[c.index],a=document.getElementById('challengeText').value.trim();if(!a){toast('Write your reasoning first.');return}finishChallenge(writtenCorrect(x,a))}
function progress(){const r=results(),qs=r.filter(x=>x.type==='quiz'),avg=qs.length?Math.round(qs.reduce((s,x)=>s+x.percent,0)/qs.length):0;document.getElementById('main').innerHTML=`<div class="page-head"><div><h1>Progress</h1><p>Results stay separated by lesson and activity.</p></div><button class="back" onclick="go('terms')">← Term 1</button></div><div class="stats"><div class="stat"><small>Quiz attempts</small><b>${qs.length}</b></div><div class="stat"><small>Average quiz</small><b>${avg}%</b></div><div class="stat"><small>XP</small><b>${xp()}</b></div><div class="stat"><small>Activities</small><b>${r.length}</b></div></div><div class="progress-list">${r.length?r.map(x=>`<div class="progress-row"><div><b>${x.type==='quiz'?'📝 Quiz':'🧠 Challenge'} · Lesson ${x.lesson} · ${x.type==='quiz'?'Set '+x.id:'Challenge '+x.id}</b><span>${x.percent}%</span></div><div class="bar"><div class="fill" style="width:${x.percent}%"></div></div><small class="muted">${esc(x.date)}</small></div>`).join(''):`<div class="result"><h3>No activity yet</h3><p class="muted">Complete a quiz or challenge.</p></div>`}</div>`}
function worksheets(){let h=`<div class="page-head"><div><h1>Worksheets</h1><p>20 questions per lesson, taken from the Word file you provided. Solutions are not shown here.</p></div><button class="back" onclick="go('terms')">← Term 1</button></div><div class="unit-grid">`;for(const [u,m] of Object.entries(MODULES)){h+=`<section class="unit"><div class="unit-head"><div class="unit-icon">📄</div><div><h3>${u}</h3><p>${m.lessons.length} lessons</p></div></div><div class="lessons">${m.lessons.map(id=>`<button class="lesson" onclick="openWorksheet('${id}')"><span><b>${id}</b> · ${esc(getLesson(id)?.title||'')}</span><span>→</span></button>`).join('')}</div></section>`}h+='</div>';document.getElementById('main').innerHTML=h}
function openWorksheet(id){const l=getLesson(id);document.getElementById('main').innerHTML=`<div class="page-head"><div><button class="back" onclick="go('worksheets')">← Worksheets</button><h1 style="margin-top:13px">${id} · Worksheet</h1><p>${esc(l.title)} · 20 source questions</p></div></div>${l.questions.map((q,i)=>`<div class="question" style="margin-bottom:12px"><span class="tag">Question ${i+1}</span><div class="qtext">${clean(q.html)}</div>${q.options?.length?`<div class="answers">${q.options.map(o=>`<div class="answer">${clean(o)}</div>`).join('')}</div>`:`<textarea id="ws_${id}_${i}" style="width:100%;min-height:100px;margin-top:15px;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="Write your answer..."></textarea>`}</div>`).join('')}<button class="primary" onclick="saveWorksheet('${id}')">Save Worksheet</button>`}
function saveWorksheet(id){const l=getLesson(id),a={};l.questions.forEach((q,i)=>{const e=document.getElementById('ws_'+id+'_'+i);if(e)a[i]=e.value});localStorage.setItem('aa_ws_'+id,JSON.stringify({answers:a,date:new Date().toLocaleString()}));toast('Worksheet saved on this device.')}
function mathworld(){const x=xp(),levels=[['🔢','Number Sense',0],['🏠','Algebra House',40],['🏫','Function School',100],['🏛️','Math Academy',200],['🚀','Math Space',350]];document.getElementById('main').innerHTML=`<div class="page-head"><div><h1>Math World</h1><p>Progress comes from actual solved activities.</p></div><button class="back" onclick="go('terms')">← Term 1</button></div><div class="world"><h2>🌟 Your Math World</h2><p class="muted">XP: <b>${x}</b></p><div class="xpbar" style="margin-top:9px"><div style="width:${Math.min(100,(x%50)*2)}%"></div></div><div class="world-stage">${levels.map(a=>`<div class="world-item ${x<a[2]?'locked':''}"><div style="font-size:40px">${a[0]}</div><b>${a[1]}</b><small class="muted">${x>=a[2]?'Unlocked':'Unlock at '+a[2]+' XP'}</small></div>`).join('')}</div></div>`}
function achievements(){const r=results(),q=r.filter(x=>x.type==='quiz'),c=r.filter(x=>x.type==='challenge'),x=xp(),opened=Number(localStorage.getItem('aa_lessons_opened')||0);const a=[['🌟','First Step',r.length>0],['🔥','On Fire',q.length>=5],['🧠','Thinker',c.length>=10],['📚','Book Explorer',opened>=5],['🏆','Perfect Score',q.some(z=>z.percent===100)],['⚡','Fast Learner',x>=100],['🎓','Math Master',x>=300],['👑','Elite Student',x>=600]];document.getElementById('main').innerHTML=`<div class="page-head"><div><h1>Achievements</h1><p>Badges unlock from real learning activity.</p></div><button class="back" onclick="go('terms')">← Term 1</button></div><div class="achievement-grid">${a.map(z=>`<div class="achievement" style="opacity:${z[2]?1:.42}"><div style="font-size:38px">${z[0]}</div><h3>${z[1]}</h3><p>${z[2]?'Unlocked':'Locked'}</p></div>`).join('')}</div>`}
function profilePage(){const p=prof(),av=p.avatar||AVATARS[0];document.getElementById('main').innerHTML=`<div class="page-head"><div><h1>My Profile</h1><p>Edit your student details and choose an avatar from the platform.</p></div><button class="back" onclick="back()">← Back</button></div><div class="profile-box"><div class="profile-layout"><div class="profile-preview"><div class="big-avatar" id="bigAvatar">${av}</div><b>Choose avatar</b><div class="avatar-grid">${AVATARS.map(a=>`<button class="avatar-option ${a===av?'selected':''}" onclick="selectAvatar('${a}')">${a}</button>`).join('')}</div></div><div><div class="fields"><div class="field full"><label>Three-part name *</label><input id="e_name" value="${esc(p.fullName||'')}"></div><div class="field"><label>Country *</label><select id="e_country"><option>United Arab Emirates • الإمارات العربية المتحدة</option></select></div><div class="field"><label>Emirate *</label><select id="e_emirate">${['Sharjah • الشارقة','Dubai • دبي','Abu Dhabi • أبوظبي','Ajman • عجمان','Umm Al Quwain • أم القيوين','Ras Al Khaimah • رأس الخيمة','Fujairah • الفجيرة'].map(x=>`<option ${x===p.emirate?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Full school name *</label><input id="e_school" value="${esc(p.schoolName||'')}"></div><div class="field"><label>Grade *</label><select id="e_grade"><option>Grade 9 • التاسع</option></select></div><div class="field"><label>Track *</label><select id="e_track"><option>Advanced • متقدم</option></select></div><div class="field"><label>Section</label><input id="e_section" value="${esc(p.section||'')}" placeholder="A / B / C"></div></div><div class="actions"><button class="primary" onclick="saveProfileEdit()">💾 Save Changes</button><button class="secondary" onclick="logout()">Logout</button></div></div></div></div>`}
function selectAvatar(a){const p=prof();p.avatar=a;setProf(p);document.getElementById('bigAvatar').textContent=a;document.querySelectorAll('.avatar-option').forEach(b=>b.classList.toggle('selected',b.textContent===a));document.querySelector('.mini-avatar').textContent=a;toast('Avatar selected.')}
function saveProfileEdit(){const p=prof();p.fullName=document.getElementById('e_name').value.trim();p.schoolName=document.getElementById('e_school').value.trim();p.country=document.getElementById('e_country').value;p.emirate=document.getElementById('e_emirate').value;p.grade=document.getElementById('e_grade').value;p.track=document.getElementById('e_track').value;p.section=document.getElementById('e_section').value.trim();if(!p.fullName||!p.schoolName){toast('Complete the required fields.');return}setProf(p);render();toast('Profile updated.')}
function logout(){localStorage.removeItem('aa_profile');showAuth()}
function showAuth(){document.getElementById('app').innerHTML=`<div class="auth"><div class="auth-card"><span class="pill">🎓 Student Access</span><h1 style="margin-top:14px">An Educational Platform for Mathematics</h1><p class="muted">Grade 9 Advanced Mathematics · UAE Curriculum</p><button class="primary" style="width:100%;margin-top:20px" onclick="showSetup()">👤 Student Login →</button></div></div>`}
function showSetup(){setupAvatar=AVATARS[0];document.getElementById('app').innerHTML=`<div class="auth"><div class="auth-card"><button class="back" onclick="showAuth()">← Back</button><h1 style="margin-top:15px">Student Information</h1><p class="muted">Choose an avatar from the website and complete your profile.</p><div class="profile-layout" style="margin-top:18px"><div class="profile-preview"><div class="big-avatar" id="setupAvatar">${setupAvatar}</div><b>Avatar</b><div class="avatar-grid">${AVATARS.map((a,i)=>`<button class="avatar-option ${i===0?'selected':''}" onclick="setupPick('${a}')">${a}</button>`).join('')}</div></div><div><div class="auth-grid"><div class="field full"><label>Three-part name *</label><input id="s_name" placeholder="Your full name"></div><div class="field"><label>Country *</label><select id="s_country"><option>United Arab Emirates • الإمارات العربية المتحدة</option></select></div><div class="field"><label>Emirate *</label><select id="s_emirate"><option>Sharjah • الشارقة</option><option>Dubai • دبي</option><option>Abu Dhabi • أبوظبي</option><option>Ajman • عجمان</option><option>Umm Al Quwain • أم القيوين</option><option>Ras Al Khaimah • رأس الخيمة</option><option>Fujairah • الفجيرة</option></select></div><div class="field full"><label>Search or type your school *</label><input id="s_school" placeholder="Full school name"></div><div class="field"><label>Grade *</label><select id="s_grade"><option>Grade 9 • التاسع</option></select></div><div class="field"><label>Track *</label><select id="s_track"><option>Advanced • متقدم</option></select></div><div class="field"><label>Section · optional</label><input id="s_section" placeholder="A / B / C"></div></div><div class="auth-actions"><button class="primary" onclick="finishSetup()">Continue to platform →</button></div></div></div></div></div>`}
function setupPick(a){setupAvatar=a;document.getElementById('setupAvatar').textContent=a;document.querySelectorAll('#app .avatar-option').forEach(b=>b.classList.toggle('selected',b.textContent===a))}
function finishSetup(){const p={avatar:setupAvatar,fullName:document.getElementById('s_name').value.trim(),country:document.getElementById('s_country').value,emirate:document.getElementById('s_emirate').value,schoolName:document.getElementById('s_school').value.trim(),grade:document.getElementById('s_grade').value,track:document.getElementById('s_track').value,section:document.getElementById('s_section').value.trim()};if(!p.fullName||!p.schoolName){toast('Complete the required name and school fields.');return}setProf(p);render();toast('Welcome to the platform!')}
if(prof().fullName)render();else showAuth();
</script></body></html>
